<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login RH | ForjaForte</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Inter",sans-serif;
}



body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

    linear-gradient(
    135deg,
    rgba(0,0,0,.9),
    rgba(25,25,25,.95)
    ),

    url("assets/img/fabrica.jpg");

    background-size:cover;

    background-position:center;

}



/* CARD */


.login-box{

    width:420px;

    background:
    rgba(255,255,255,.96);

    padding:45px;

    border-radius:18px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.45);

    animation:
    aparecer .5s ease;

}



@keyframes aparecer{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:none;

}

}





.logo{

    text-align:center;

    margin-bottom:30px;

}



.logo img{

    width:90px;

    margin-bottom:15px;

}



.logo h1{

    font-size:28px;

    color:#111;

}



.logo strong{

    color:#d35400;

}



.logo p{

    margin-top:8px;

    color:#666;

    font-size:14px;

}






.input-group{

    margin-bottom:20px;

}



label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#333;

}



input{

    width:100%;

    padding:15px;

    border:

    1px solid #ddd;

    border-radius:10px;

    font-size:15px;

    outline:none;

    transition:.3s;

}



input:focus{

    border-color:#d35400;

    box-shadow:
    0 0 0 3px rgba(211,84,0,.15);

}






button{


width:100%;

padding:15px;

border:none;

border-radius:10px;

background:

linear-gradient(
135deg,
#d35400,
#e67e22
);


color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.3s;


}



button:hover{

transform:translateY(-2px);

box-shadow:

0 10px 25px rgba(211,84,0,.35);

}



#mensagem{

margin-top:20px;

text-align:center;

font-size:14px;

}



.erro{

color:#c0392b;

}



.sucesso{

color:#27ae60;

}





.footer-login{

text-align:center;

margin-top:30px;

font-size:12px;

color:#888;

}





@media(max-width:480px){

.login-box{

width:90%;

padding:30px;

}

}



</style>


</head>


<body>



<div class="login-box">



<div class="logo">


<img 
src="assets/img/image.png"
alt="ForjaForte">


<h1>
Forja<strong>Forte</strong>
</h1>


<p>
Painel Administrativo RH
</p>


</div>





<div class="input-group">

<label>
E-mail
</label>


<input

id="email"

type="email"

placeholder="Digite seu e-mail">


</div>





<div class="input-group">

<label>
Senha
</label>


<input

id="senha"

type="password"

placeholder="Digite sua senha">


</div>






<button onclick="login()">

Entrar no painel

</button>




<div id="mensagem"></div>



<div class="footer-login">

Sistema interno ForjaForte

</div>



</div>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


const SUPABASE_URL =
"https://dafbbagzpnigfuekjbfd.supabase.co";


const SUPABASE_KEY =
"sb_publishable_rzQ1xfRLw_UfEFM-Mr6a2Q_kTFmunLu";



const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





async function login(){



const email =
document.querySelector("#email").value;


const senha =
document.querySelector("#senha").value;


const mensagem =
document.querySelector("#mensagem");



mensagem.innerHTML =
"Entrando...";




const {error} =
await supabaseClient.auth
.signInWithPassword({

email,

password:senha

});




if(error){


mensagem.innerHTML =
"Usuário ou senha inválidos";


mensagem.className =
"erro";


return;


}




mensagem.innerHTML =
"Acesso autorizado";


mensagem.className =
"sucesso";



setTimeout(()=>{


window.location.href =
"admin.html";


},800);



}



</script>



</body>

</html>
