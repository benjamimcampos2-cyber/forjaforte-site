    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel RH | ForjaForte</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Inter, sans-serif;
      }

      body {
        background: #f3f4f6;
        color: #222;
      }

      /* LAYOUT */

      .layout {
        display: flex;
        min-height: 100vh;
      }

      /* SIDEBAR */

      .sidebar {
        width: 260px;
        background: #111827;
        color: white;
        padding: 30px 20px;
      }

      .logo {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 40px;
      }

      .logo span {
        color: #e67e22;
      }

      .menu a {
        display: block;
        padding: 15px;
        margin-bottom: 10px;
        color: #ddd;
        text-decoration: none;
        border-radius: 10px;
      }

      .menu a:hover {
        background: #1f2937;
        color: white;
      }

      /* CONTEUDO */

      .content {
        flex: 1;
        padding: 35px;
      }

      /* HEADER */

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
      }

      .topbar h1 {
        font-size: 28px;
      }

      .btn-sair {
        background: #dc2626;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }

      /* CARDS */

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 35px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }

      .card h3 {
        color: #777;
        font-size: 14px;
      }

      .card strong {
        display: block;
        font-size: 35px;
        margin-top: 10px;
        color: #d35400;
      }

      /* TABELA */

      .box {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }

      .box-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      #busca {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        width: 300px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #111827;
        color: white;
        padding: 15px;
        text-align: left;
      }

      td {
        padding: 15px;
        border-bottom: 1px solid #eee;
      }

      .curriculo {
        background: #d35400;
        color: white;
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
      }

      .msg {
        max-width: 250px;
        color: #555;
      }

      @media (max-width: 900px) {
        .sidebar {
          display: none;
        }

        .cards {
          grid-template-columns: 1fr;
        }

        .content {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KV59CJRK"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">Forja<span>Forte</span></div>

        <div class="menu">
          <a href="#"> Dashboard </a>

          <a href="#"> Candidatos </a>

          <a href="#"> Vagas </a>

          <a href="#"> Configurações </a>
        </div>
      </aside>

      <main class="content">
        <div class="topbar">
          <h1>Painel de Candidatos</h1>

          <button class="btn-sair" onclick="logout()">Sair</button>
        </div>

        <div class="cards">
          <div class="card">
            <h3>Total candidatos</h3>

            <strong id="total"> 0 </strong>
          </div>

          <div class="card">
            <h3>Últimos recebidos</h3>

            <strong id="recentes"> 0 </strong>
          </div>

          <div class="card">
            <h3>Vagas procuradas</h3>

            <strong id="vagas"> 0 </strong>
          </div>
        </div>

        <div class="box">
          <div class="box-header">
            <h2>Candidaturas</h2>

            <input id="busca" placeholder="Buscar candidato ou vaga" />
          </div>

          <table>
            <thead>
              <tr>
                <th>Nome</th>

                <th>Contato</th>

                <th>Cidade</th>

                <th>Vaga</th>

                <th>Mensagem</th>

                <th>Currículo</th>
              </tr>
            </thead>

            <tbody id="lista"></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://dafbbagzpnigfuekjbfd.supabase.co";

      const SUPABASE_KEY = "sb_publishable_rzQ1xfRLw_UfEFM-Mr6a2Q_kTFmunLu";

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let candidatos = [];

      async function verificarLogin() {
        const { data } = await supabaseClient.auth.getSession();

        if (!data.session) {
          window.location.href = "login.html";
        }
      }

      async function carregar() {
        const { data, error } = await supabaseClient
          .from("candidatos")
          .select("*")
          .order("created_at", {
            ascending: false,
          });

        if (error) {
          console.error(error);

          return;
        }

        candidatos = data;

        document.querySelector("#total").innerHTML = data.length;

        document.querySelector("#recentes").innerHTML = data.slice(0, 5).length;

        document.querySelector("#vagas").innerHTML = new Set(
          data.map((x) => x.vaga),
        ).size;

        render(data);
      }

      function render(lista) {
        const tabela = document.querySelector("#lista");

        tabela.innerHTML = "";

        lista.forEach((c) => {
          const data = new Date(c.created_at).toLocaleDateString("pt-BR");

          tabela.innerHTML += `


<tr>

<td>
<strong>${c.nome}</strong>
<br>
${data}
</td>


<td>
${c.email}
<br>
${c.telefone}
</td>


<td>
${c.cidade}
</td>


<td>
${c.vaga}
</td>


<td class="msg">
${c.mensagem || "-"}
</td>


<td>

<a 
class="curriculo"
target="_blank"
href="${c.curriculo_url}">

PDF

</a>


</td>


</tr>


`;
        });
      }

      document.querySelector("#busca").addEventListener("input", (e) => {
        const t = e.target.value.toLowerCase();

        render(
          candidatos.filter(
            (c) =>
              c.nome.toLowerCase().includes(t) ||
              c.vaga.toLowerCase().includes(t),
          ),
        );
      });

      async function logout() {
        await supabaseClient.auth.signOut();

        window.location.href = "login.html";
      }

      verificarLogin();

      carregar();
    </script>
    <script src="js/pwa.js"></script>
  </body>
</html>
